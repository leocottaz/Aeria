name: Release

# Publier : git tag v0.1.0 && git push origin v0.1.0
# Les notes de release sont générées depuis les messages de commit (tools/release-notes.sh).
on:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Compiler et empaqueter (ZIP portable)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAERIA_VERSION=${{ github.ref_name }}
          cmake --build build
          cd build && cpack -G ZIP
      - name: Préparer les fichiers de l'installateur
        run: cmake --install build --prefix "$PWD/stage"
      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DStageDir=$PWD\stage" "/DOutDir=$PWD\dist" installer\windows\aeria.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rassembler les fichiers à publier
        run: |
          mkdir -p out
          cp build/Aeria-*-windows-x64.zip dist/Aeria-*-setup.exe out/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Dépendances
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libcurl4-openssl-dev libx11-dev
      - name: Compiler et empaqueter (archive portable)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAERIA_VERSION=${{ github.ref_name }}
          cmake --build build
          cd build && cpack -G TGZ
      - name: Paquet .deb
        run: |
          cmake -S . -B build-deb -G Ninja -DCMAKE_BUILD_TYPE=Release -DAERIA_DEB_LAYOUT=ON -DAERIA_VERSION=${{ github.ref_name }}
          cmake --build build-deb
          cd build-deb && cpack -G DEB
      - name: Rassembler les fichiers à publier
        run: |
          mkdir -p out
          cp build/Aeria-*-linux-*.tar.gz build-deb/aeria_*.deb out/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Historique complet : les notes sont la liste des commits depuis le tag précédent.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Notes de release (commits depuis le tag précédent)
        run: bash tools/release-notes.sh "${{ github.ref_name }}" release-notes.md && cat release-notes.md
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # L'updater de l'application (src/features/updater.cpp) vérifie l'installateur d'après ce fichier.
      - name: Empreintes SHA-256
        working-directory: dist
        run: |
          ls -l
          sha256sum Aeria-* aeria_* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # Texte produit par tools/release-notes.sh : lignes « - … » lues par l'écran « Nouveautés » de l'app.
          body_path: release-notes.md
          # v0.3.1-dev… : version de test, jamais « dernière release » (l'updater ne retient que vX.Y.Z).
          prerelease: ${{ contains(github.ref_name, '-') }}
